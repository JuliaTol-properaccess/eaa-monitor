name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # De wekelijkse scrape en de WCAG-scan pushen verse data als
  # github-actions[bot]. Pushes met de default GITHUB_TOKEN triggeren geen
  # andere workflows (de anti-recursieregel van GitHub), dus zonder deze
  # workflow_run zou het dashboard oude data blijven serveren. workflow_run
  # vuurt na afloop van die runs, ongeacht wie er pushte.
  #
  # De WCAG-scan stond hier niet bij tot 2 september 2026. Gevolg: de scan van
  # dinsdag kwam pas de maandag erna live, meegelift op de deploy van de
  # scrape. Op 1 september 2026 draaide de scan groen terwijl monitor.html de
  # meting van 25 augustus bleef tonen.
  workflow_run:
    workflows: ["Scrape webshop footers", "WCAG-scan sites met verklaring"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vangnet: bouw de Tailwind-CSS vers, ook als iemand vergat
      # `npm run build:css` te draaien na een class-wijziging. De gebouwde
      # public/static/tailwind.css staat ook in git voor lokaal testen.
      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      # Bevestigde nominaties commit de Worker direct naar data/halloffame.json
      # op main (zonder PR). Die commit triggert deze deploy; we bouwen de
      # eregalerij hier opnieuw zodat de nieuwe vermelding meteen live staat.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build eregalerij uit data/halloffame.json
        run: |
          pip install markdown pyyaml
          python tools/build_halloffame.py

      # De volledige meetlijsten staan niet in git (2,6 MB die elke week
      # verandert). Ze worden hier gebouwd uit data/results*.json, zodat de
      # hele telling ook zonder JavaScript leesbaar is.
      - name: Build Engelse kennisbank
        run: python tools/build_articles_en.py

      - name: Build volledige meetlijsten
        run: python tools/build_lijsten.py

      - name: Prepare site
        run: |
          mkdir -p _site
          # Kopieer de volledige public-tree, inclusief submappen zoals
          # public/artikelen/ en public/static/. Een platte glob zou submappen
          # missen, waardoor de kennisbank niet gedeployed zou worden.
          cp -R public/. _site/
          cp -R data _site/data

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # EU-stack: dezelfde inhoud naar de Hetzner-VPS (eaa-monitor-1), die na
      # de DNS-cutover de site serveert. Tot die tijd draait hij warm mee.
      # DEPLOY_SSH_KEY is een repo-secret; de host-key staat hier vastgepind.
      - name: Deploy to VPS (Hetzner)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "128.140.50.96 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIy0Moek4VWZPI6BGKSYIccIT2eN9uAtXhShZyDNPXnl" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" _site/ root@128.140.50.96:/var/www/eaa-monitor/
          rsync -az -e "ssh -i ~/.ssh/deploy_key" worker/src worker/server.mjs worker/package.json root@128.140.50.96:/opt/eaa-forms/
          # ALERT_TOKEN (uit het GitHub-secret) in de Worker-env zetten zodat de
          # /alert-route de faal- en staleness-meldingen kan versturen. Idempotent:
          # eventuele oude regel eruit, verse waarde erin. Daarna pas herstarten.
          ssh -i ~/.ssh/deploy_key root@128.140.50.96 "touch /etc/eaa-forms.env && sed -i '/^ALERT_TOKEN=/d' /etc/eaa-forms.env && printf 'ALERT_TOKEN=%s\n' '${{ secrets.ALERT_TOKEN }}' >> /etc/eaa-forms.env && systemctl restart eaa-forms"

      # IndexNow: meld de belangrijkste (wekelijks verversende) pagina's aan bij
      # zoekmachines die het protocol ondersteunen (onder andere Bing, dat
      # ChatGPT search en Copilot voedt). De sleutel staat als keyfile in public/.
      # Faalt de ping, dan mag de deploy niet rood worden.
      - name: Ping IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "eaa-monitor.nl",
              "key": "80dc7574d9b5690e7d2fa51210c01bc9",
              "keyLocation": "https://eaa-monitor.nl/80dc7574d9b5690e7d2fa51210c01bc9.txt",
              "urlList": [
                "https://eaa-monitor.nl/",
                "https://eaa-monitor.nl/monitor.html",
                "https://eaa-monitor.nl/monitor-financieel.html",
                "https://eaa-monitor.nl/monitor-telecom.html",
                "https://eaa-monitor.nl/monitor-vervoer.html",
                "https://eaa-monitor.nl/monitor-media.html",
                "https://eaa-monitor.nl/monitor-ebooks.html",
                "https://eaa-monitor.nl/artikelen.html",
                "https://eaa-monitor.nl/bronnen.html",
                "https://eaa-monitor.nl/vragen.html",
                "https://eaa-monitor.nl/tools.html",
                "https://eaa-monitor.nl/eregalerij.html",
                "https://eaa-monitor.nl/wcag-audit.html",
                "https://eaa-monitor.nl/artikelen.html"
              ]
            }' || true
