name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The weekly scrape pushes fresh results.json as github-actions[bot]. Pushes
  # made with the default GITHUB_TOKEN don't trigger other workflows (GitHub's
  # anti-recursion rule), so without this the dashboard would keep serving stale
  # data. workflow_run fires after the scrape completes regardless of who pushed.
  workflow_run:
    workflows: ["Scrape webshop footers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp public/*.html _site/
          cp public/*.js _site/
          cp public/CNAME _site/
          cp public/robots.txt _site/
          cp public/sitemap.xml _site/
          cp public/llms.txt _site/
          cp -r public/static _site/static
          cp -r data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
